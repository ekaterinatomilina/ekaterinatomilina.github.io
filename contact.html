<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="nav">
  <a href="index.html">Home</a>
  <a href="projects.html">Projects</a>
  <a href="research.html">Research</a>
  <a href="contact.html">Contact</a>
</div>

<div class="container">
<div class="card full">
  <h3>Contact</h3>
  Contact me via this form and I will get back to you as soon as possible by e-mail.
  <form action="https://formspree.io/f/meedwelj" method="POST" class="contact-form">

    <div class="form-group">
      <label>Your name</label>
      <input type="text" name="name" required>
    </div>

    <div class="form-group">
      <label>Your e-mail</label>
      <input type="email" name="email" required>
    </div>
    
    <div class="form-group">
      <label>Type of request</label>
      <select name="request_type" required>
        <option value="">Select an option</option>
        <option value="data_science">Training</option>
        <option value="statistical_modeling">Statistical consulting</option>
        <option value="automation">Automation via R or Python tool</option>
        <option value="other">Other</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Additional information</label>
      <textarea name="message" rows="5" required></textarea>
    </div>

    <button type="submit" class="button">Send message</button>

  </form>

</div>
</div>

</body>
</html>
